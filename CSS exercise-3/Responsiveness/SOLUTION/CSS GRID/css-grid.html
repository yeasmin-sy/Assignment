<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid</title>
    <style>
        main{
            width: 100%;
            display: grid;
            grid-template-rows: 100px 200px 200px;
            grid-template-columns: repeat(2,1fr);
            grid-gap:25px;

        }
        div{
            background-color: blue;
        }
        #div1{
            grid-column:1/-1;
        }

    </style>
</head>
<body>
    <h1>CSS Grid</h1>
    <main>
        
        <div id="div1"></div>
        <div id="div2"></div>
        <div id="div3"></div>
        <div id="div4"></div>
        <div id="div5"></div>
    </main>
</body>
</html>
