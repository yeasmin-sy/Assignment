<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: flex;
            flex-direction: row;
        }
     .item{
        background-color: blue;
        border: 30px solid white;
        height: 100px;
        flex: 1;
     }

     .first {
        flex: 2;
     }
     .second {
        flex: 0.5;
     }
     
 
    </style>
</head>
<body>
    <h1>CSS Flexbox</h1>
    <div class="container">
       <div class="first item"></div>
       <div class="second item"></div>
       <div class="item" ></div>
       <div class="item" ></div>
    </div>
</body>
</html>
